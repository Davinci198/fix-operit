name: clone-debug-quick

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/ai/assistance/operit/data/agent/DshBrain.kt'
      - 'app/src/main/java/com/ai/assistance/operit/core/tools/ToolRegistration.kt'
      - 'examples/dsh_toolpkg/dsh_toolpkg.ts'
  workflow_dispatch:

jobs:
  clone-debug-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Quick compile cloneDebug
        run: |
          ./gradlew :app:compileCloneDebugKotlin :app:checkBundledToolPkgs --stacktrace
      - name: Build clone debug APK
        run: ./gradlew :app:assembleCloneDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-clone-debug
          path: app/build/outputs/apk/clone/debug/*.apk
