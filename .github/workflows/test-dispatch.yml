name: Test Dispatch
on:
  workflow_dispatch:
    inputs:
      test_input:
        description: 'Test input'
        required: false
        default: 'hello'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Test input
        run: |
          echo "Test successful - input: ${{ github.event.inputs.test_input }}"
