name: Clone Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix-* ]

jobs:
  build-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Set up swap 10GB
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fix Gradle mirror + wrapper
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties
          chmod +x gradlew || true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install SDK/NDK/CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Restore manual deps cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets
          key: manual-deps-${{ hashFiles('scripts/**') }}
          restore-keys: manual-deps-

      - name: Download Android dependencies
        run: |
          python3 scripts/download_deps.py || echo "skip deps download"

      - name: Prepare Android dependencies
        run: |
          python3 scripts/prepare_android.py || echo "skip prepare"

      - name: Cache Rust cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build native ripgrep
        run: |
          cargo install ripgrep --features pcre2 || true

      - name: FIX CRITICAL - DELETE qwen3_tts_demo COMPLETELY
        run: |
          echo "=== Deleting qwen3_tts_demo everywhere ==="
          find . -name "qwen3_tts_demo*" -type f -delete 2>/dev/null || true
          find . -path "*mnn*" -name "*qwen3*" -delete 2>/dev/null || true
          rm -rf llm/mnn/transformers/llm/engine/demo/qwen3_tts_demo.cpp || true
          rm -rf llm/mnn/transformers/llm/engine/demo/audio || true
          
          echo "=== Patching llm/mnn/build.gradle.kts - removing from targets ==="
          if [ -f llm/mnn/build.gradle.kts ]; then
            sed -i 's/"qwen3_tts_demo",*//g' llm/mnn/build.gradle.kts || true
            sed -i "s/'qwen3_tts_demo',*//g" llm/mnn/build.gradle.kts || true
            sed -i 's/qwen3_tts_demo//g' llm/mnn/build.gradle.kts || true
          fi
          
          echo "=== Dummy audio.hpp safety net ==="
          mkdir -p llm/mnn/transformers/llm/engine/demo/audio
          cat > llm/mnn/transformers/llm/engine/demo/audio/audio.hpp << 'EOF'
          #pragma once
          #include <string>
          namespace MNN { namespace AUDIO { template<typename... Args> inline void save(Args&&...) {} } }
          EOF
          
          echo "=== Clean all CXX caches ==="
          rm -rf app/.cxx || true
          rm -rf llm/mnn/.cxx || true
          rm -rf ~/.cxx || true
          
          echo "FIX DONE"
          grep -R "qwen3_tts_demo" llm/mnn/build.gradle.kts && echo "WARN: inca in gradle" || echo "CLEAN"

      - name: FIX DEFINITIV - Scoate qwen3 din targets NINJA
        run: |
          echo "=== Dezactivez BUILD_DEMO complet pentru MNN ==="
          if [ -f llm/mnn/build.gradle.kts ]; then
            sed -i 's/-DMNN_SEP_BUILD=false/-DMNN_SEP_BUILD=false", "-DMNN_BUILD_DEMO=OFF", "-DMNN_BUILD_TOOLS=OFF/g' llm/mnn/build.gradle.kts || true
            sed -i 's/MNN_BUILD_DEMO=ON/MNN_BUILD_DEMO=OFF/g' llm/mnn/build.gradle.kts || true
            sed -i 's/MNN_BUILD_DEMO", "ON/MNN_BUILD_DEMO", "OFF/g' llm/mnn/build.gradle.kts || true
          fi
          echo "=== Fix gata ==="

      - name: Clean CXX cache
        run: |
          rm -rf app/.cxx llm/mnn/.cxx
          ./gradlew clean --no-daemon || true

      - name: Setup DragonBones Prebuilt AAR
        run: |
          ls app/libs/ || echo "no libs"

      - name: Install JS deps
        run: |
          npm ci || npm install

      - name: Build WebChat + ToolPkg
        run: |
          npm run build || npx tsc || echo "web build skip"

      - name: Configure SDK + Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "storeFile=file(../release.keystore)" >> app/keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> app/keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> app/keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> app/keystore.properties
          fi

      - name: Run Gradle build - CLONE RELEASE
        run: |
          ./gradlew :app:assembleCloneRelease --no-daemon --stacktrace -Dorg.gradle.caching=false 2>&1 | tee gradle.log
          echo "GRADLE EXIT CODE: ${PIPESTATUS[0]}"

      - name: Verify APK signature
        if: success()
        run: |
          ls -lh app/build/outputs/apk/cloneRelease/*.apk
          apksigner verify --print-certs app/build/outputs/apk/cloneRelease/*.apk || true

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clone-${{ github.run_number }}
          name: "RO-Operit Clone v1.13.6+${{ github.run_number }}"
          files: app/build/outputs/apk/cloneRelease/*.apk
          generate_release_notes: true

      - name: Upload APK Clone
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-clone-release
          path: app/build/outputs/apk/cloneRelease/*.apk

      - name: Upload log on fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            gradle.log
            app/build/outputs/logs/
            llm/mnn/.cxx/**/CMakeFiles/CMakeError.log

      - name: Post Cache Rust cargo
        if: always()
        run: echo "done"
