name: Clone Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix-* ]

permissions:
  contents: write

jobs:
  build-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Set up swap 10GB
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fix Gradle mirror + wrapper
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.parallel=true" >> ~/.gradle/gradle.properties
          chmod +x gradlew || true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install SDK/NDK/CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Restore manual deps cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets
          key: manual-deps-${{ hashFiles('scripts/**') }}
          restore-keys: manual-deps-

      - name: Download Android dependencies
        run: |
          python3 scripts/download_deps.py || true

      - name: Prepare Android dependencies
        run: |
          python3 scripts/prepare_android.py || true

      - name: Cache Rust cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build native ripgrep
        run: |
          cargo install ripgrep --features pcre2 || true

      - name: FIX CRITICAL - DELETE qwen3_tts_demo COMPLETELY
        run: |
          find . -name "qwen3_tts_demo*" -type f -delete 2>/dev/null || true
          find . -path "*mnn*" -name "*qwen3*" -delete 2>/dev/null || true
          rm -rf llm/mnn/transformers/llm/engine/demo/qwen3_tts_demo.cpp || true
          rm -rf llm/mnn/transformers/llm/engine/demo/audio || true
          if [ -f llm/mnn/build.gradle.kts ]; then
            sed -i 's/"qwen3_tts_demo",*//g' llm/mnn/build.gradle.kts || true
            sed -i "s/'qwen3_tts_demo',*//g" llm/mnn/build.gradle.kts || true
            sed -i 's/qwen3_tts_demo//g' llm/mnn/build.gradle.kts || true
          fi
          mkdir -p llm/mnn/transformers/llm/engine/demo/audio
          cat > llm/mnn/transformers/llm/engine/demo/audio/audio.hpp << 'EOF'
          #pragma once
          #include <string>
          namespace MNN { namespace AUDIO { template<typename... Args> inline void save(Args&&...) {} } }
          EOF
          rm -rf app/.cxx llm/mnn/.cxx ~/.cxx || true

      - name: FIX DEFINITIV - Scoate qwen3 din targets NINJA
        run: |
          if [ -f llm/mnn/build.gradle.kts ]; then
            sed -i 's/-DMNN_SEP_BUILD=false/-DMNN_SEP_BUILD=false", "-DMNN_BUILD_DEMO=OFF", "-DMNN_BUILD_TOOLS=OFF/g' llm/mnn/build.gradle.kts || true
            sed -i 's/MNN_BUILD_DEMO=ON/MNN_BUILD_DEMO=OFF/g' llm/mnn/build.gradle.kts || true
          fi

      - name: Clean CXX cache
        run: |
          rm -rf app/.cxx llm/mnn/.cxx
          ./gradlew clean --no-daemon || true

      - name: Setup DragonBones Prebuilt AAR
        run: ls app/libs/ || true

      - name: Install JS deps
        run: npm ci || npm install

      - name: Build WebChat + ToolPkg
        run: npm run build || npx tsc || true

      - name: Configure SDK + Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ls -lh app/release.keystore
            cat > app/keystore.properties << PROP
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROP
          else
            echo "No keystore"
            echo "NO_KEYSTORE=true" >> $GITHUB_ENV
          fi

      - name: Run Gradle build - CLONE RELEASE
        run: |
          ./gradlew :app:assembleCloneRelease --no-daemon --stacktrace -Dorg.gradle.caching=false 2>&1 | tee gradle.log
          echo "=== LIST ALL APKs ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Collect APKs to root
        run: |
          mkdir -p ./apk_out
          find . -path "*/build/outputs/apk/*/*.apk" -type f -exec cp -v {} ./apk_out/ \; 2>/dev/null || true
          find app/build -name "*.apk" -type f -exec cp -v {} ./apk_out/ \; 2>/dev/null || true
          ls -lh ./apk_out/
          echo "APK_COUNT=$(ls ./apk_out/*.apk 2>/dev/null | wc -l)" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: env.APK_COUNT != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clone-${{ github.run_number }}
          name: "RO-Operit Clone v1.13.6+${{ github.run_number }}"
          files: ./apk_out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload APK Clone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-clone-release
          path: ./apk_out/*.apk
          if-no-files-found: warn
