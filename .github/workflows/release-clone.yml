name: Clone Release Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free space + Swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Download deps
        run: |
          rm -rf app/src/main/assets
          python3 scripts/download_deps.py
          python3 scripts/prepare_android.py || true
          du -sh app/src/main/assets

      - name: Fix qwen3 bug
        run: |
          rm -rf llm/mnn/transformers/llm/engine/demo/qwen3_tts_demo.cpp
          rm -rf app/.cxx llm/mnn/.cxx
          mkdir -p llm/mnn/transformers/llm/engine/demo/audio
          echo '#pragma once
          namespace MNN { namespace AUDIO { template<typename... Args> inline void save(Args&&...) {} } }' > llm/mnn/transformers/llm/engine/demo/audio/audio.hpp

      - name: Build
        run: |
          npm ci
          npm run build || true
          ./gradlew :app:assembleCloneRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk_out
          find . -path "*build/outputs/apk/*/*.apk" -exec cp {} apk_out/ \;
          ls -lh apk_out/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clone-${{ github.run_number }}
          files: apk_out/*.apk
          generate_release_notes: true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-clone-release
          path: apk_out/*.apk
