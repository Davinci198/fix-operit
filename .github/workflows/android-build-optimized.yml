name: Android Build - Optimized Clone

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task (CLONE for parallel install)
        required: true
        default: ':app:assembleCloneDebug'
        type: choice
        options:
          - ':app:assembleCloneDebug'
          - ':app:assembleCloneRelease'
          - ':app:assembleStandardDebug'
      run_unit_tests:
        required: false
        default: false
        type: boolean

concurrency:
  group: android-build-clone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_CMAKE_VERSION: '3.22.1'
  _JAVA_OPTIONS: "-Xmx4g"

jobs:
  build:
    name: Build Clone APK (Prebuilt DragonBones)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up swap 10GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Show space
        run: df -h; free -h

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-clone-ndk27-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-clone-ndk27-

      - name: Install SDK NDK CMake
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"

      - name: Restore deps cache
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: manual-deps
          key: deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh') }}

      - name: Download deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "manual-deps"

      - name: Prepare deps
        run: python3 ci/script/prepare_android_dependencies.py --profile full --archives "manual-deps" --repository "$GITHUB_WORKSPACE" --clean || python3 ci/script/prepare_android_dependencies.py --profile full --archives "manual-deps" --repository "$GITHUB_WORKSPACE"

      - name: Setup DragonBones Prebuilt AAR
        run: |
          mkdir -p app/libs
          if [ -f app/libs/dragonbones-release.aar ]; then echo "AAR exists"; else curl -L -o app/libs/dragonbones-release.aar https://github.com/Davinci198/dragonbones-aar-prebuilt/releases/download/v1.0.0-ndk27-fix/dragonbones-release.aar; fi
          ls -lh app/libs/dragonbones-release.aar

      - name: Install JS deps
        run: |
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Build WebChat
        run: npm --prefix web-chat run typecheck || true; npm run build:webchat || true

      - name: Configure SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Clean corrupted CXX cache
        run: |
          rm -rf app/.cxx
          rm -rf app/src/main/cpp/.cxx
          rm -rf app/build/intermediates/cxx
          rm -rf ~/.gradle/caches/modules-2/files-2.1/io.github.operit
          echo "CXX cache cleaned"

      - name: Build CLONE APK
        run: |
          case "${{ github.event_name }}" in push) TASK=":app:assembleCloneDebug" ;; workflow_dispatch) TASK="${{ inputs.gradle_task }}" ;; *) TASK=":app:assembleCloneDebug" ;; esac
          chmod +x ./gradlew
          ./gradlew $TASK --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Xms2g" | tee gradle.log
          grep "BUILD SUCCESSFUL" gradle.log

      - name: Upload APK Clone
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fix-operit-clone-${{ github.run_number }}
          path: |
            app/build/outputs/apk/clone/debug/*.apk
            app/build/outputs/apk/clone/release/*.apk
          if-no-files-found: error
          retention-days: 14
